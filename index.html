<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>兄妹健康之约</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; background:#F5F0E8; color:#3A3A3A; min-height:100vh; }
.container { max-width:420px; margin:0 auto; padding:0 0 80px 0; }

.header { background: linear-gradient(135deg, #C4A44A, #9A7B2E); color:white; padding:24px 20px 20px; border-radius:0 0 24px 24px; position:relative; overflow:hidden; }
.header::after { content:''; position:absolute; right:-60px; top:-60px; width:200px; height:200px; border:2px solid rgba(255,255,255,0.15); border-radius:50%; }
.header h1 { font-size:22px; margin-bottom:4px; }
.header p { font-size:13px; opacity:0.85; }

.milestone { background:white; margin:12px 16px; border-radius:16px; padding:20px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,0.06); position:relative; overflow:hidden; }
.milestone::before { content:''; position:absolute; top:-30px; right:-30px; width:100px; height:100px; border-radius:50%; background:rgba(196,164,74,0.08); }
.milestone-days { font-size:48px; font-weight:800; color:#C4A44A; line-height:1; }
.milestone-days span { font-size:16px; font-weight:400; color:#6B6B6B; }
.milestone-week { font-size:15px; color:#5C6B3C; font-weight:600; margin-top:6px; }
.milestone-sub { font-size:13px; color:#9A9A9A; margin-top:4px; }
.milestone-quote { font-size:13px; color:#C4A44A; margin-top:10px; font-style:italic; }

.user-tabs { display:flex; gap:8px; padding:12px 16px 4px; }
.user-tab { flex:1; text-align:center; padding:10px; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer; transition:all .2s; border:2px solid #E0D8C8; background:white; color:#6B6B6B; }
.user-tab.active { background:#5C6B3C; color:white; border-color:#5C6B3C; }

.checkin-card { background:white; margin:12px 16px; border-radius:16px; padding:20px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
.checkin-card h3 { font-size:16px; color:#5C6B3C; margin-bottom:14px; display:flex; align-items:center; gap:6px; }

/* 今日状态提示 */
.today-status { padding:12px 16px; border-radius:12px; margin-bottom:14px; font-size:14px; display:flex; align-items:center; gap:8px; }
.today-status.done { background:#E8F5E9; color:#2E7D32; }
.today-status.not-done { background:#FFF8E1; color:#F57F17; }
.today-status .status-icon { font-size:20px; }

.form-row { margin-bottom:14px; }
.form-row label { display:block; font-size:13px; color:#6B6B6B; margin-bottom:6px; }
.btn-group { display:flex; gap:8px; flex-wrap:wrap; }
.pill-btn { padding:8px 16px; border-radius:20px; border:2px solid #E0D8C8; background:white; font-size:14px; cursor:pointer; transition:all .2s; color:#3A3A3A; }
.pill-btn.active { background:#5C6B3C; color:white; border-color:#5C6B3C; }
.duration-input { display:flex; align-items:center; gap:8px; }
.duration-input input { width:80px; padding:10px 14px; border:2px solid #E0D8C8; border-radius:12px; font-size:16px; text-align:center; outline:none; }
.duration-input input:focus { border-color:#5C6B3C; }
.duration-input span { font-size:14px; color:#6B6B6B; }
.other-input { margin-top:8px; }
.other-input input { width:100%; padding:10px 14px; border:2px solid #E0D8C8; border-radius:12px; font-size:14px; outline:none; }
.other-input input:focus { border-color:#5C6B3C; }
.submit-btn { width:100%; padding:14px; background:linear-gradient(135deg, #5C6B3C, #7A8B45); color:white; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; margin-top:6px; transition:all .1s; }
.submit-btn:active { transform:scale(0.97); }
.submit-btn.disabled { background:#E0D8C8; color:#9A9A9A; cursor:not-allowed; }

.stats-card { background:white; margin:12px 16px; border-radius:16px; padding:18px 20px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
.stats-card h3 { font-size:15px; color:#C4A44A; margin-bottom:12px; }
.stats-row { display:flex; justify-content:space-around; }
.stat-item { text-align:center; }
.stat-num { font-size:28px; font-weight:700; color:#5C6B3C; }
.stat-label { font-size:12px; color:#9A9A9A; margin-top:2px; }

.history-card { background:white; margin:12px 16px; border-radius:16px; padding:18px 20px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
.history-card h3 { font-size:15px; color:#C4A44A; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
.card-actions { display:flex; gap:8px; }
.action-btn { font-size:12px; color:#5C6B3C; cursor:pointer; background:#F5F0E8; border:none; padding:4px 10px; border-radius:8px; }
.history-list { max-height:400px; overflow-y:auto; }
.history-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #F5F0E8; }
.history-item:last-child { border:none; }
.hi-left { display:flex; align-items:center; gap:10px; }
.hi-icon { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; }
.hi-icon.站桩 { background:#E8F0E0; }
.hi-icon.打坐 { background:#E8E0F0; }
.hi-icon.走路 { background:#FFF5E0; }
.hi-icon.其他 { background:#E0F0F0; }
.hi-info .hi-sport { font-size:14px; font-weight:600; }
.hi-info .hi-time { font-size:12px; color:#9A9A9A; }
.hi-info .hi-period { font-size:11px; color:#C4A44A; margin-top:2px; }
.hi-dur { font-size:15px; font-weight:600; color:#5C6B3C; }
.hi-del { font-size:18px; color:#ccc; cursor:pointer; margin-left:8px; padding:4px; }
.empty-msg { text-align:center; color:#9A9A9A; font-size:14px; padding:20px 0; }

.footer { text-align:center; padding:20px; font-size:12px; color:#B8B8B8; }

.toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.8); background:rgba(0,0,0,0.75); color:white; padding:16px 28px; border-radius:12px; font-size:15px; opacity:0; transition:all .3s; pointer-events:none; z-index:999; }
.toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }

.modal-bg { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:998; justify-content:center; align-items:center; }
.modal-bg.show { display:flex; }
.modal { background:white; border-radius:16px; padding:24px; width:90%; max-width:360px; max-height:80vh; overflow-y:auto; }
.modal h3 { font-size:16px; margin-bottom:12px; color:#5C6B3C; }
.modal textarea { width:100%; height:200px; border:2px solid #E0D8C8; border-radius:10px; padding:12px; font-size:13px; font-family:monospace; resize:vertical; }
.modal-btns { display:flex; gap:8px; margin-top:12px; }
.modal-btn { flex:1; padding:10px; border-radius:10px; border:none; font-size:14px; font-weight:600; cursor:pointer; }
.modal-btn.copy { background:#5C6B3C; color:white; }
.modal-btn.close { background:#E0D8C8; color:#3A3A3A; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🌿 兄妹健康之约</h1>
    <p>坚持每一天 · 记录每一步</p>
  </div>

  <div class="milestone">
    <div class="milestone-days" id="totalDaysNum">0 <span>天</span></div>
    <div class="milestone-week" id="weekNum">第 1 周</div>
    <div class="milestone-sub" id="dateRange">2026年7月20日 起步</div>
    <div class="milestone-quote" id="quote">坚持的力量，在于每一天</div>
  </div>

  <div class="user-tabs">
    <div class="user-tab active" onclick="switchUser('哥')">🧑 哥</div>
    <div class="user-tab" onclick="switchUser('妹')">👧 妹</div>
  </div>

  <div class="checkin-card">
    <h3>📝 今日打卡</h3>
    
    <!-- 今日状态提示 -->
    <div class="today-status not-done" id="todayStatus">
      <span class="status-icon">⏰</span>
      <span id="statusText">今日还未打卡，加油！</span>
    </div>
    
    <div id="checkinForm">
      <!-- 时段选择 -->
      <div class="form-row">
        <label>时段</label>
        <div class="btn-group" id="periodBtns">
          <div class="pill-btn active" onclick="selectPeriod(this,'上午')">🌅 上午</div>
          <div class="pill-btn" onclick="selectPeriod(this,'下午')">🌤 下午</div>
          <div class="pill-btn" onclick="selectPeriod(this,'晚上')">🌙 晚上</div>
        </div>
      </div>
      
      <!-- 运动类型 -->
      <div class="form-row">
        <label>运动项目</label>
        <div class="btn-group" id="sportBtns">
          <div class="pill-btn active" onclick="selectSport(this,'站桩')">🧘 站桩</div>
          <div class="pill-btn" onclick="selectSport(this,'打坐')">🧘‍♀️ 打坐</div>
          <div class="pill-btn" onclick="selectSport(this,'走路')">🚶 走路</div>
          <div class="pill-btn" onclick="selectSport(this,'其他')">✏️ 其他</div>
        </div>
        <div class="other-input" id="otherInput" style="display:none">
          <input type="text" id="otherSport" placeholder="请输入运动项目名称">
        </div>
      </div>
      
      <!-- 运动时长 -->
      <div class="form-row">
        <label>运动时长</label>
        <div class="duration-input">
          <input type="number" id="duration" placeholder="30" min="1" max="300">
          <span>分钟</span>
        </div>
      </div>
      
      <button class="submit-btn" id="submitBtn" onclick="submitCheckin()">✅ 打卡</button>
    </div>
  </div>

  <div class="stats-card">
    <h3>📊 <span id="userLabel">哥</span>的累计</h3>
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-num" id="activeDays">0</div>
        <div class="stat-label">打卡天数</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="totalMin">0</div>
        <div class="stat-label">总时长(min)</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="totalCount">0</div>
        <div class="stat-label">打卡次数</div>
      </div>
    </div>
  </div>

  <div class="history-card">
    <h3>
      <span>📋 打卡记录</span>
      <div class="card-actions">
        <button class="action-btn" onclick="exportData()">📤 导出</button>
        <button class="action-btn" onclick="clearHistory()">🗑 清空</button>
      </div>
    </h3>
    <div class="history-list" id="historyList">
      <div class="empty-msg">还没有打卡记录，快来第一条吧！</div>
    </div>
  </div>

  <div class="footer">作者Ali 和她的 agent 小葡萄🤖</div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>📤 导出数据</h3>
    <p style="font-size:13px;color:#9A9A9A;margin-bottom:10px">复制下方内容发给小葡萄，即可自动生成周报图表</p>
    <textarea id="exportText" readonly></textarea>
    <div class="modal-btns">
      <button class="modal-btn copy" onclick="copyExport()">📋 复制</button>
      <button class="modal-btn close" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const START_DATE = new Date(2026, 6, 20);
const quotes = [
  "坚持的力量，在于每一天",
  "日拱一卒，功不唐捐",
  "不积跬步，无以至千里",
  "流水不争先，只因长流不断",
  "日复一日的坚持，是最好的自律",
  "每一天的努力，都在雕刻更好的自己",
  "习惯的力量，在于从不间断",
  "把坚持变成习惯，把习惯变成本能",
  "时间不会辜负每一份坚持",
  "慢慢来，比较快"
];

let currentUser = '哥';
let currentPeriod = '上午';
let currentSport = '站桩';

function getToday() {
  return new Date().toLocaleDateString('zh-CN');
}

function getData() {
  const d = localStorage.getItem('health_checkin_data');
  return d ? JSON.parse(d) : { '哥': [], '妹': [] };
}
function saveData(data) {
  localStorage.setItem('health_checkin_data', JSON.stringify(data));
}

function hasCheckedInThisPeriod() {
  const data = getData();
  const records = data[currentUser] || [];
  const today = getToday();
  return records.some(r => r.date === today && r.period === currentPeriod);
}

function switchUser(user) {
  currentUser = user;
  document.querySelectorAll('.user-tab').forEach((t,i) => {
    t.classList.toggle('active', (i===0 && user==='哥') || (i===1 && user==='妹'));
  });
  document.getElementById('userLabel').textContent = user;
  renderAll();
}

function selectPeriod(el, period) {
  currentPeriod = period;
  document.querySelectorAll('#periodBtns .pill-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderCheckinStatus();
}

function selectSport(el, sport) {
  currentSport = sport;
  document.querySelectorAll('#sportBtns .pill-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  
  // 显示/隐藏其他运动输入框
  const otherInput = document.getElementById('otherInput');
  if (sport === '其他') {
    otherInput.style.display = 'block';
    document.getElementById('otherSport').focus();
  } else {
    otherInput.style.display = 'none';
    document.getElementById('otherSport').value = '';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function submitCheckin() {
  if (hasCheckedInThisPeriod()) {
    showToast(`本时段已打卡，换个时段继续加油！`);
    return;
  }
  
  const dur = parseInt(document.getElementById('duration').value);
  if (!dur || dur <= 0) { showToast('请输入运动时长'); return; }
  
  // 如果是"其他"，需要填写运动名称
  let sportName = currentSport;
  if (currentSport === '其他') {
    const otherVal = document.getElementById('otherSport').value.trim();
    if (!otherVal) { showToast('请输入运动项目名称'); return; }
    sportName = otherVal;
  }
  
  const data = getData();
  const now = new Date();
  const record = {
    period: currentPeriod,
    sport: sportName,
    duration: dur,
    date: now.toLocaleDateString('zh-CN'),
    time: now.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}),
    ts: now.getTime()
  };
  data[currentUser].unshift(record);
  saveData(data);
  document.getElementById('duration').value = '';
  showToast('✅ 打卡成功！');
  renderAll();
}

function deleteRecord(idx) {
  const data = getData();
  data[currentUser].splice(idx, 1);
  saveData(data);
  renderAll();
}

function clearHistory() {
  if (!confirm(`确定清空${currentUser}的所有打卡记录吗？`)) return;
  const data = getData();
  data[currentUser] = [];
  saveData(data);
  renderAll();
}

function exportData() {
  const data = getData();
  let text = `# 兄妹健康之约 - 打卡数据导出\n`;
  text += `# 导出时间：${new Date().toLocaleString('zh-CN')}\n`;
  text += `# 起始日期：2026年7月20日\n\n`;
  
  ['哥','妹'].forEach(user => {
    const records = data[user] || [];
    text += `## ${user}\n`;
    if (records.length === 0) {
      text += '暂无记录\n\n';
      return;
    }
    const totalMin = records.reduce((s,r) => s + r.duration, 0);
    const days = new Set(records.map(r => r.date)).size;
    text += `累计：${records.length}次打卡，${days}天，共${totalMin}分钟\n\n`;
    text += `| 日期 | 时段 | 运动 | 时长 |\n`;
    text += `|------|------|------|------|\n`;
    records.forEach(r => {
      text += `| ${r.date} | ${r.period} | ${r.sport} | ${r.duration}分钟 |\n`;
    });
    text += '\n';
  });
  
  document.getElementById('exportText').value = text;
  document.getElementById('modalBg').classList.add('show');
}

function copyExport() {
  const textarea = document.getElementById('exportText');
  textarea.select();
  document.execCommand('copy');
  showToast('✅ 已复制，发给小葡萄吧！');
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('show');
}

function renderMilestone() {
  const now = new Date();
  const diffMs = now - START_DATE;
  const diffDays = Math.floor(diffMs / (1000*60*60*24)) + 1;
  const weekNum = Math.ceil(diffDays / 7);
  
  document.getElementById('totalDaysNum').innerHTML = `${diffDays} <span>天</span>`;
  document.getElementById('weekNum').textContent = `第 ${weekNum} 周`;
  document.getElementById('dateRange').textContent = `2026年7月20日 起步 · 至今`;
  
  const quoteIdx = diffDays % quotes.length;
  document.getElementById('quote').textContent = `「${quotes[quoteIdx]}」`;
}

function renderCheckinStatus() {
  const statusDiv = document.getElementById('todayStatus');
  const statusText = document.getElementById('statusText');
  const submitBtn = document.getElementById('submitBtn');
  
  if (hasCheckedInThisPeriod()) {
    statusDiv.className = 'today-status done';
    statusText.textContent = `✅ 本时段已打卡，换个时段可继续打卡！`;
    submitBtn.className = 'submit-btn disabled';
    submitBtn.textContent = '本时段已打卡';
    submitBtn.onclick = function() { showToast('本时段已打卡，换个时段继续加油'); };
  } else {
    statusDiv.className = 'today-status not-done';
    statusText.textContent = `⏰ 当前时段未打卡，加油！`;
    submitBtn.className = 'submit-btn';
    submitBtn.textContent = '✅ 打卡';
    submitBtn.onclick = submitCheckin;
  }
}

function getSportIcon(sport) {
  if (sport === '站桩') return '🧘';
  if (sport === '打坐') return '🧘‍♀️';
  if (sport === '走路') return '🚶';
  return '🏃';
}

function renderAll() {
  renderMilestone();
  renderCheckinStatus();
  
  const data = getData();
  const records = data[currentUser] || [];
  
  const days = new Set(records.map(r => r.date)).size;
  const totalMin = records.reduce((s,r) => s + r.duration, 0);
  document.getElementById('activeDays').textContent = days;
  document.getElementById('totalMin').textContent = totalMin;
  document.getElementById('totalCount').textContent = records.length;
  
  const list = document.getElementById('historyList');
  if (records.length === 0) {
    list.innerHTML = '<div class="empty-msg">还没有打卡记录，快来第一条吧！</div>';
    return;
  }
  list.innerHTML = records.map((r, i) => `
    <div class="history-item">
      <div class="hi-left">
        <div class="hi-icon ${r.sport}">${getSportIcon(r.sport)}</div>
        <div class="hi-info">
          <div class="hi-sport">${r.sport}</div>
          <div class="hi-period">${r.period}</div>
          <div class="hi-time">${r.date} ${r.time}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center">
        <span class="hi-dur">${r.duration}min</span>
        <span class="hi-del" onclick="deleteRecord(${i})">×</span>
      </div>
    </div>
  `).join('');
}

renderAll();
</script>
</body>
</html>
